<!DOCTYPE html>
<html lang="pt-BR" data-prep-leitor>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PDF</title>
<link rel="icon" href="/prep/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/prep/tema.css">
<script src="/prep/tema.js"></script>
<link rel="stylesheet" href="/prep/base.css">
<link rel="stylesheet" href="/prep/pdf/pdfjs/pdf_viewer.css">
<link rel="stylesheet" href="/prep/pdf/leitor.css">
<script src="/prep/traducao.js" defer></script>
<script type="module" src="/prep/pdf/leitor.js"></script>
</head>
<body>
<header class="lp-barra">
  <a class="ibtn" id="b-voltar" href="/" aria-label="Voltar" hidden>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
  </a>
  <div class="lp-titulo" id="titulo"></div>
  <div class="lp-modos" id="modos" role="group" aria-label="Como ler" hidden>
    <button type="button" id="m-pagina" aria-pressed="true">Página</button>
    <button type="button" id="m-texto" aria-pressed="false">Texto</button>
  </div>
  <div class="lp-zoom">
    <button class="ibtn" type="button" id="b-menos" aria-label="Diminuir" disabled>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
    </button>
    <button class="ibtn" type="button" id="b-mais" aria-label="Aumentar" disabled>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>
  </div>
  <label class="lp-pag">
    <input id="pag" type="number" inputmode="numeric" min="1" value="1" aria-label="Página" disabled>
    <span id="pag-total">/ –</span>
  </label>
</header>
<div class="lp-estado" id="estado" role="status" hidden>
  <!-- .lp-cx é a pílula flutuante; a faixa em si fica com altura zero, só marcando o lugar (leitor.css) -->
  <div class="lp-cx">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
    <span id="estado-txt"></span>
    <button type="button" class="btn" id="estado-btn" hidden>Tentar de novo</button>
  </div>
</div>
<main id="palco">
  <div id="viewerContainer" tabindex="0"><div id="viewer" class="pdfViewer"></div></div>
  <div id="texto" tabindex="0" hidden><div id="texto-in"></div></div>
  <div id="aviso" role="status"><p id="aviso-txt">Abrindo o PDF…</p></div>
</main>
</body>
</html>
